name: Build PS Vita VPK

# Builds the general AstraRecomp Vita frontend. This does not embed the
# privately supplied NFSMW game ELF or its game-specific translated code.
on:
  push:
    branches:
      - main
      - nfsmw-ps2-startup-aot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Portable AstraIR verification
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check translator semantics
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tools -p test_astrair.py
      - name: Configure native host tests
        run: cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release
      - name: Compile CPU differential tests
        run: cmake --build build-host --parallel 2 --target ps2core_tests bare_elf_startup_syscalls_tests native_iop_services_tests native_host_file_backend_tests ioprp_image_tests iop_sif_handshake_tests nfsmw_startup_replay
      - name: Run CPU and translator regression tests
        run: ctest --test-dir build-host --output-on-failure -R '^(ps2core_tests|bare_elf_startup_syscalls_tests|native_iop_services_tests|native_host_file_backend_tests|ioprp_image_tests|iop_sif_handshake_tests|astrair_builder_tests)$'

      - name: Generate freely redistributable guest-code fixture
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B tools/make_smoke_elf.py /tmp/astrarecomp-private-aot-smoke.elf
      - name: Smoke-test typed host replay diagnostics without private game assets
        run: |
          build-host/nfsmw_startup_replay /tmp/astrarecomp-private-aot-smoke.elf 100000 --native-iop > /tmp/nfsmw-host-replay.txt
          cat /tmp/nfsmw-host-replay.txt
          grep -q '^replay=host-interpreter-only$' /tmp/nfsmw-host-replay.txt
          grep -q '^reason=' /tmp/nfsmw-host-replay.txt
          grep -q '^rpc_client=00000000$' /tmp/nfsmw-host-replay.txt
          grep -q '^rpc_reject_flags=0$' /tmp/nfsmw-host-replay.txt
          grep -q '^fileio_calls=0$' /tmp/nfsmw-host-replay.txt
          grep -q '^fileio_ee_libkernl_tag=00000000$' /tmp/nfsmw-host-replay.txt
          grep -q '^fileio_version_reply_armed=0$' /tmp/nfsmw-host-replay.txt
          # Add a synthetic EE tag outside the ELF loadable segment. The
          # interpreter must report it without fabricating an IOP response.
          cp /tmp/astrarecomp-private-aot-smoke.elf /tmp/astrarecomp-tagged-smoke.elf
          printf 'PsIIlibkernl2800' >> /tmp/astrarecomp-tagged-smoke.elf
          build-host/nfsmw_startup_replay /tmp/astrarecomp-tagged-smoke.elf 100000 --native-iop > /tmp/nfsmw-tagged-replay.txt
          grep -q '^fileio_ee_libkernl_tag=30303832$' /tmp/nfsmw-tagged-replay.txt
          grep -q '^fileio_version_reply_armed=0$' /tmp/nfsmw-tagged-replay.txt
          build-host/nfsmw_startup_replay /tmp/astrarecomp-private-aot-smoke.elf 100000 --native-iop --file-root /tmp > /tmp/nfsmw-host-file-replay.txt
          grep -q '^file_root_enabled=1$' /tmp/nfsmw-host-file-replay.txt
          if build-host/nfsmw_startup_replay /tmp/astrarecomp-private-aot-smoke.elf 100000 --native-iop --file-root /tmp/astrarecomp-no-such-root; then
            echo 'Missing FILEIO root was accepted' >&2
            exit 1
          fi
      - name: Generate redistributable ROMDIR fixture for host IOPRP replay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          image = bytearray(0xB0)
          for index, (name, size) in enumerate((
              ("RESET", 0), ("ROMDIR", 0x70), ("EXTINFO", 16),
              ("IOPBTCONF", 16), ("SIFCMD", 16), ("CDVDFSV", 16),
          )):
              at = index * 16
              image[at:at + len(name)] = name.encode("ascii")
              image[at + 12:at + 16] = size.to_bytes(4, "little")
          Path("/tmp/astrarecomp-synthetic-ioprp.img").write_bytes(image)
          Path("/tmp/astrarecomp-truncated-ioprp.img").write_bytes(image[:-1])
          PY
      - name: Verify opt-in IOPRP replay and malformed-image rejection
        run: |
          build-host/nfsmw_startup_replay /tmp/astrarecomp-private-aot-smoke.elf 100000 --native-iop --ioprp /tmp/astrarecomp-synthetic-ioprp.img > /tmp/nfsmw-ioprp-replay.txt
          grep -q '^ioprp_valid=1$' /tmp/nfsmw-ioprp-replay.txt
          grep -q '^ioprp_entries=6$' /tmp/nfsmw-ioprp-replay.txt
          grep -q '^ioprp_padding_missing=0$' /tmp/nfsmw-ioprp-replay.txt
          if build-host/nfsmw_startup_replay /tmp/astrarecomp-private-aot-smoke.elf 100000 --ioprp /tmp/astrarecomp-synthetic-ioprp.img; then
            echo 'IOPRP without native IOP was accepted' >&2
            exit 1
          fi
          if build-host/nfsmw_startup_replay /tmp/astrarecomp-private-aot-smoke.elf 100000 --native-iop --ioprp /tmp/astrarecomp-truncated-ioprp.img; then
            echo 'Truncated IOPRP was accepted' >&2
            exit 1
          fi
      - name: Configure private-title native code linkage
        run: cmake -S . -B build-private-aot -DCMAKE_BUILD_TYPE=Release -DASTRART_GAME_ELF=/tmp/astrarecomp-private-aot-smoke.elf
      - name: Compile independently generated title-code package
        run: cmake --build build-private-aot --parallel 2 --target private_game_aot_probe
      - name: Compare linked native title code against guest interpreter
        run: ctest --test-dir build-private-aot --output-on-failure -R '^private_game_aot_probe$'

  vita-vpk:
    needs: host-tests
    name: VitaSDK VPK
    runs-on: ubuntu-24.04
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure VitaSDK build
        run: |
          cmake -S . -B build-vita \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
      - name: Compile native Vita VPK
        run: cmake --build build-vita --parallel 2
      - name: Compile title-specific Vita frontend with synthetic AOT only
        run: |
          # This fixture is generated from freely redistributable guest code.
          # Compile the private-title conditional code path without packaging
          # or uploading any NFSMW game code, disc data, or firmware.
          python3 tools/make_smoke_elf.py /tmp/astrarecomp-synthetic-vita.elf
          cmake -S . -B build-vita-synthetic-aot \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DASTRART_PRIVATE_VITA_ELF=/tmp/astrarecomp-synthetic-vita.elf
          cmake --build build-vita-synthetic-aot --parallel 2 --target ps2vita
      - name: Upload installable VPK
        uses: actions/upload-artifact@v4
        with:
          name: AstraRecomp-Vita-VPK
          path: build-vita/ps2vita.vpk
          if-no-files-found: error
          retention-days: 14
